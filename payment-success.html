<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful | TURIN PREMIUM STORE</title>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RF9N3ZKHT9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-RF9N3ZKHT9");
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111827;
    }

    .card {
      width: min(92%, 560px);
      background: #ffffff;
      border-radius: 22px;
      padding: 45px 30px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,0.10);
    }

    .success {
      width: 82px;
      height: 82px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: #16a34a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    p {
      color: #6b7280;
      line-height: 1.6;
      font-size: 16px;
    }

    .order {
      margin: 25px 0;
      padding: 16px;
      border-radius: 12px;
      background: #f3f4f6;
      font-size: 14px;
      word-break: break-word;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      background: #111827;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }

    .small {
      margin-top: 25px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="success">✓</div>

    <h1>Payment Successful</h1>

    <p>
      Thank you for your purchase from
      <strong>TURIN PREMIUM STORE</strong>.
      Your payment has been received successfully.
    </p>

    <div class="order" id="orderBox">
      Processing your order...
    </div>

    <a href="/" class="btn">
      Continue Shopping
    </a>

    <div class="small">
      TURIN PREMIUM STORE<br>
      International Online Store
    </div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const reference =
      params.get("reference") ||
      params.get("order") ||
      params.get("session_id");

    const provider = params.get("provider") || "";

    const orderBox = document.getElementById("orderBox");

    async function confirmPaymentAndTrackPurchase() {
      if (!reference) {
        orderBox.innerHTML =
          "<strong>Payment received</strong><br>" +
          "Your order is being processed.";
        return;
      }

      orderBox.innerHTML =
        "<strong>Order Reference</strong><br>" +
        reference +
        "<br><br>Confirming payment...";

      try {
        const response = await fetch(
          "/api/orders/" + encodeURIComponent(reference),
          {
            method: "GET",
            headers: {
              "Accept": "application/json"
            },
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error("Unable to verify order");
        }

        const order = await response.json();

        const paymentStatus =
          String(order.paymentStatus || "").toLowerCase();

        if (paymentStatus !== "paid") {
          orderBox.innerHTML =
            "<strong>Order Reference</strong><br>" +
            reference +
            "<br><br>" +
            "Payment is still being confirmed.";
          return;
        }

        orderBox.innerHTML =
          "<strong>Order Reference</strong><br>" +
          reference +
          "<br><br>" +
          "Payment confirmed successfully.";

        const purchaseKey =
          "turin_purchase_tracked_" + reference;

        const alreadyTracked =
          localStorage.getItem(purchaseKey) === "true";

        if (alreadyTracked) {
          return;
        }

        const exchangeRate = 2550;

        const totalTZS =
          Number(
            order.totalTZS ??
            order.total ??
            order.amountTZS ??
            0
          );

        const totalUSD =
          Number(
            order.paymentAmountUSD ??
            order.amountUSD ??
            0
          ) ||
          (totalTZS > 0 ? totalTZS / exchangeRate : 0);

        const items = Array.isArray(order.items)
          ? order.items.map(function(item) {
              const quantity =
                Number(
                  item.quantity ??
                  item.qty ??
                  1
                );

              const unitPriceTZS =
                Number(
                  item.unitPriceTZS ??
                  item.price ??
                  item.unitPrice ??
                  0
                );

              return {
                item_id: String(
                  item.productId ??
                  item.id ??
                  item.product_id ??
                  ""
                ),
                item_name:
                  item.name ||
                  item.productName ||
                  "Product",
                price: unitPriceTZS / exchangeRate,
                quantity: quantity
              };
            })
          : [];

        if (
          typeof gtag === "function" &&
          totalUSD > 0
        ) {
          gtag("event", "purchase", {
            transaction_id: reference,
            value: totalUSD,
            currency: "USD",
            items: items
          });

          localStorage.setItem(
            purchaseKey,
            "true"
          );
        }

      } catch (error) {
        orderBox.innerHTML =
          "<strong>Order Reference</strong><br>" +
          reference +
          "<br><br>" +
          "Payment received. Your order is being processed.";
      }
    }

    confirmPaymentAndTrackPurchase();
  </script>

</body>
</html>
