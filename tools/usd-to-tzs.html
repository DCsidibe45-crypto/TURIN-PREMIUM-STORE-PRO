<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USD to TZS Converter | TURIN</title>
<meta name="description" content="Convert US Dollars to Tanzanian Shillings instantly with TURIN's USD to TZS converter.">
</head>
<body>

<h1>USD to TZS Converter</h1>

<label for="usd">US Dollars (USD)</label>
<input id="usd" type="number" min="0" step="any" placeholder="Enter USD amount">

<button onclick="convert()">Convert</button>

<h2 id="result">Enter an amount</h2>

<p id="rateInfo"></p>

<script>
let rate = null;

async function getRate() {
  try {
    const response = await fetch(
      "https://open.er-api.com/v6/latest/USD"
    );

    if (!response.ok) {
      throw new Error("Rate request failed");
    }

    const data = await response.json();

    if (!data.rates || !data.rates.TZS) {
      throw new Error("TZS rate unavailable");
    }

    rate = Number(data.rates.TZS);

    document.getElementById("rateInfo").textContent =
      `Current rate: 1 USD ≈ ${rate.toLocaleString()} TZS`;

  } catch (error) {
    rate = null;

    document.getElementById("rateInfo").textContent =
      "Unable to load live exchange rate. Please try again.";
  }
}

async function convert() {
  const usd = Number(document.getElementById("usd").value);
  const result = document.getElementById("result");

  if (!usd || usd < 0) {
    result.textContent = "Enter a valid amount";
    return;
  }

  if (rate === null) {
    result.textContent = "Loading live exchange rate...";
    await getRate();
  }

  if (rate === null) {
    result.textContent = "Live exchange rate unavailable";
    return;
  }

  const tzs = usd * rate;

  result.textContent =
    `${usd.toLocaleString()} USD ≈ ${tzs.toLocaleString()} TZS`;
}

getRate();
</script>

</body>
</html>
